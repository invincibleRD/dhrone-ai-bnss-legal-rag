name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/invinciblerd/dhrone-ai-bnss-legal-rag-backend
  COVERAGE_MIN_LINES: 60

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # threshold lives here so it is enforced in CI even if vitest.config changes
      - run: npm run test:cov -- --coverage.thresholds.lines=${{ env.COVERAGE_MIN_LINES }}
        working-directory: backend
      - uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: coverage
          path: backend/coverage
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - id: check
        run: test -f frontend/package-lock.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4.1.0
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci && npm run build
        working-directory: frontend

  retrieval:
    # the golden set runs against the in-process retriever, so a hosted runner
    # is enough. fork PRs are still gated, same guard as build.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: golden set regression gate
        working-directory: backend
        run: npx vitest run tests/retrieval.eval.test.js

  build:
    # fork PRs never push an image
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/build-push-action@v6.10.0
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          # unfixed CVEs in the debian base have no patch to apply, so failing on
          # them means the build can never go green. anything with a fix still fails.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - uses: docker/login-action@v3.3.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.10.0
        if: github.event_name == 'push'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}

  # The vercel production alias follows whatever branch the dashboard calls
  # production, which is not visible from the repo. Promoting explicitly here
  # makes main the production url regardless of that setting.
  vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: promote main to the vercel production url
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "vercel secrets are not set, skipping."
            echo "add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to make"
            echo "every main merge publish to the production url."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
